    <style>
        body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("images/background2.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

/* HEADER */

/* SMALLER HEADER */
.header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 25px 20px 15px;
}

.header-top img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 15px;
}

.header-text h2 {
    margin: 0;
    font-size: 55px;
    font-weight: bold;
}

.header-text p {
    margin: 3px 0 0;
    font-size: 18px;
}

/* GLASS PANELS */
.glass-panel,
.content-section {
    width: 92%;
    max-width: 1350px;
    margin: 0 auto 35px;
    padding: 30px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow:
        0 10px 35px rgba(0,0,0,0.4);
    transition: 0.3s ease;
}

.content-section:hover {
    transform: translateY(-4px);
    box-shadow:
        0 15px 45px rgba(36,14,62,0.6);
}

.content-section h2 {
    margin-top: 0;
    text-align: left;
    font-size: 34px;
    text-shadow:
        0 0 15px #240E3E;
}

/* SOCIAL BUTTONS */
.socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
}

.socials a {
    display: inline-block;
    padding: 12px 24px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    background: rgba(36,14,62,0.75);
    border-radius: 14px;
    transition: 0.3s ease;
    box-shadow:
        0 0 10px rgba(36,14,62,0.6);
}

/* Simple purple glow on hover */
.socials a:hover {
    box-shadow:
        0 0 20px rgba(141,77,255,0.9),
        0 0 40px rgba(141,77,255,0.6);
    background:
        rgba(36,14,62,0.95);
}

/* TWITCH LIVE SECTION */
.live-section {
    max-width: 750px;
    padding: 15px;
}

.live-container {
    display: flex;
    justify-content: center;
    position: relative;
    width: 100%;
    overflow: hidden;
}

.live-container iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    max-width: 100%;
    display: block;
    border: none;
    border-radius: 18px;
    box-shadow:
        0 0 30px rgba(36,14,62,0.8),
        0 0 60px rgba(36,14,62,0.5);
}

/* LIVE BADGE */
.live-badge {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: rgba(0,0,0,0.7);
    border-radius: 999px;
    font-size: 16px;
    font-weight: bold;
    backdrop-filter: blur(10px);
}

/* Red pulsing dot */
.pulse {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff2d2d;
    animation:
        livePulse 1.5s infinite;
}



@keyframes livePulse {

    0% {
        box-shadow:
            0 0 0 0 rgba(255,0,0,0.8);
    }

    70% {
        box-shadow:
            0 0 0 15px rgba(255,0,0,0);
    }

    100% {
        box-shadow:
            0 0 0 0 rgba(255,0,0,0);
    }
}

/* HORIZONTAL VIDEO ROWS */
.video-row,
.short-row {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 12px;
    scroll-behavior: smooth;
}

/* Scrollbar styling */
.video-row::-webkit-scrollbar,
.short-row::-webkit-scrollbar {
    height: 8px;
}

.video-row::-webkit-scrollbar-thumb,
.short-row::-webkit-scrollbar-thumb {
    background: #240E3E;
    border-radius: 999px;
}

/* VIDEO CARDS */
.video-card {
    flex: 0 0 auto;
    transition: 0.3s ease;
}

.video-card:hover {
    transform: translateY(-8px);
}

.video-card iframe {
    width: 340px;
    height: 191px;
    border: none;
    border-radius: 16px;
    box-shadow:
        0 0 20px rgba(36,14,62,0.6);
}

/* SHORTS */
.short-card {
    flex: 0 0 auto;
    transition: 0.3s ease;
}

.short-card:hover {

    transform: translateY(-8px);

}

.short-card iframe {
    width: 220px;
    height: 391px;
    border: none;
    border-radius: 18px;
    box-shadow:
        0 0 20px rgba(36,14,62,0.6);
}

/* OPTIONAL EDGE FADE
   makes it obvious rows continue */
.video-row,
.short-row {
    mask-image: linear-gradient(
        to right,
        black 0%,
        black 92%,
        transparent 100%
    );
}

/* MOBILE RESPONSIVE */

@media (max-width: 900px) {

    .header-top {

        text-align: center;
    }

    }

    }

    .video-card iframe {
        width: 300px;
        height: 169px;
    }

    .short-card iframe {
        width: 200px;
        height: 355px;
    }
}

    </style>
